name: Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - gradle/libs.versions.toml
      - build.gradle.kts
      - "**/build.gradle.kts"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Check dependency updates
        uses: gradle/actions/dependency-submission@v4
