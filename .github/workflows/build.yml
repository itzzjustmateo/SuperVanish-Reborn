name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SuperVanishReborn-java${{ matrix.java }}
          path: build/libs/SuperVanishReborn-*.jar
