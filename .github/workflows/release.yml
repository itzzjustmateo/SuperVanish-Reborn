name: Release

on:
  push:
    tags:
      - "release"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - uses: astral-sh/setup-uv@v5

      - name: Resolve and bump version
        id: version
        run: |
          VERSION=$(uv run python3 tools/resolve_version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in build.gradle.kts
        run: |
          sed -i "s/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" build.gradle.kts
          sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/" src/main/resources/plugin.yml

      - name: Generate changelog
        id: changelog
        run: |
          uv run python3 tools/generate_changelog.py ${{ steps.version.outputs.version }} > CHANGELOG_TEMP.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_TEMP.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts src/main/resources/plugin.yml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag v${{ steps.version.outputs.version }}
          git push origin main
          git push origin v${{ steps.version.outputs.version }}

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: build/libs/SuperVanishReborn-*.jar
          fail_on_unmatched_files: false
          make_latest: true
          generate_release_notes: false
