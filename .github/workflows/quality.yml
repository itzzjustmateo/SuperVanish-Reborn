name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon || echo "spotless not configured yet"
      - name: Build with warnings
        run: ./gradlew build -Werror --no-daemon || echo "Werror not yet enforced"
