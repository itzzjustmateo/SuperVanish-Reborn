# SuperVanish v${project.version}

invisibility_features:
  night_vision: true
  disable_damage: true
  disable_hunger: true
  disable_mob_target: true
  # Permission: sv.silentchest — temporarily enters spectator to open chests silently
  open_chests_silently: true
  disable_pressure_plates: true
  # Uses scoreboard — may conflict with other plugins
  disable_push: false
  default_pick_up_items: false
  # Below 1.19 only
  modify_tablist_packets: true
  modify_tab_complete_packets: true
  prevent_sculk_sensor: true
  prevent_turtle_egg_break: true
  disable_drip_leaf: true
  prevent_raid_trigger: true
  # Paper only
  prevent_mob_spawning: true
  fly:
    enable: true
    # Players without sv.keepfly lose flight on reappear
    disable_on_reappear: true

vanish_state_features:
  auto_vanish_on_join: false
  reappear_on_world_change: false
  reappear_on_quit: false
  check_permission_on_world_change: false
  check_permission_on_quit: false
  check_permission_on_login: false

indication_features:
  layered_permissions:
    enable_see_permission: true
    # sv.use.levelX / sv.see.levelX — see level must be >= target use level
    layered_see_and_use_permissions: false
    # Lower values reduce permission checks on large servers
    max_level: 100
  # Below 1.19 only; shows vanished players dark gray in tablist (requires ProtocolLib)
  mark_vanished_as_spectators: true

message_options:
  fake_join_quit:
    broadcast_fake_quit_on_vanish: true
    broadcast_fake_join_on_reappear: true
    announce_to_admins: true
    admins_only: false
    users_only: false
  hide_real_join_quit: true
  hide_advancement_messages: true
  reappear_on_quit_hide_leave: true
  announce_real_join_quit_to_admins: true
  announce_death_to_admins: true
  remind_vanished_on_join: true
  display_action_bar: true

restrictive_options:
  prevent_block_breaking: false   # bypass: sv.breakblocks
  prevent_block_placing: false    # bypass: sv.placeblocks
  prevent_hitting_entities: false # bypass: sv.damage

external_invisibility:
  server_list:
    adjust_player_count: true
    hide_vanished_from_hover: true

hook_options:
  enable_essentials: true
  enable_dynmap: true
  dynmap_fake_join_leave: true
  enable_trail_gui: true
  enable_placeholder_api: true
  enable_mvdw_placeholder_api: true
  enable_citizens: true
  enable_open_inv: true
  enable_grief_prevention: false

compatibility_options:
  player_join_event_priority: HIGH
  player_quit_event_priority: HIGH

misc:
  update_checker:
    enable: true
    notify_admins: true

database:
  enabled: false
  type: mysql
  host: localhost
  port: 3306
  database: supervanish
  username: root
  password: ""
  pool_size: 4
  sync_interval_ticks: 40
  server_id: ""

config_version: ${project.version}
