# SuperVanish v${project.version} - Messages
#
# Information:
# <..> means that .. is required; [..] means that .. is optional and can be left out; | inside [] or <> stands for 'OR'
# You can use MiniMessage tags for formatting; Example: '<red>The color of this text would be red!'
# You can use <#XXXXXX> for HEX color codes. Example: '<#663EF6>This text would be purple!'
# Standard MiniMessage tags like <bold>, <italic>, <underlined>, <strikethrough>, <obfuscated> work too.
#
# You can use %p% to get the player's name; Example: '<dark_red><bold>%p%, you aren''t allowed to execute this command!'
# You can use %other% to get the name of the target or cause
# You can use %d% to get the player's display name
# You can use %tab% to get the player's name in the player list (TAB)
# You can use %prefix% to get the player's prefix (Requires Vault)
# You can use %suffix% to get the player's suffix (Requires Vault)
# You can use %group% to get the player's group (Requires Vault)
# You can use %nick% to get the player's nickname (Requires Essentials)
# Some messages allow different, unique variables too
#
# NOTE: You can get WAY more placeholders by installing PlaceholderAPI or MVdWPlaceholderAPI
#
# Empty messages will not be sent
# Using \n starts a new line
#
# Important:
# You must double single quotes if you want to use them inside a message.
# You must NOT use any tab characters inside this file!
#
Messages:
  NoPermission: '<dark_red>Denied access! You are not allowed to do this.'
  InvalidUsage: '<red>Invalid usage, you can use <gold>/sv help</gold><red> for a list of commands.'
  VanishMessage: '<yellow>%p% left the game'
  ReappearMessage: '<yellow>%p% joined the game'
  VanishMessageWithPermission: '<green>[SV] %p% vanished.'
  ReappearMessageWithPermission: '<green>[SV] %p% reappeared.'
  OnVanish: '<green>You are now invisible!'
  OnReappear: '<green>You are no longer invisible!'
  OnVanishCausedByOtherPlayer: '<green>%other% hid you, you are now invisible!'
  OnReappearCausedByOtherPlayer: '<green>%other% showed you, you are now visible!'
  AlreadyVanishedError: '<red>You are already invisible!'
  NotVanishedError: '<red>You are not invisible!'
  SilentJoinMessageForAdmins: '<green>[SV] %p% joined silently.'
  SilentQuitMessageForAdmins: '<green>[SV] %p% left silently.'
  SilentDeathMessage: '<green>[SV] %deathmsg%'
  RemindingMessage: '<green>You are still invisible!'
  ListMessagePrefix: '<green>Invisible Players:<white> %l'
  ActionBarMessage: '<green>You are invisible to other players!'
  HideOtherMessage: '<green>Player <yellow>%other%</yellow><green> is now invisible!'
  ShowOtherMessage: '<green>Player <yellow>%other%</yellow><green> is now visible!'
  CannotHideOtherPlayer: '<red>You''re not allowed to change %other%''s visibility!'
  AlreadyInvisibleMessage: '<red>Player <yellow>%other%</yellow><red> is already invisible!'
  AlreadyVisibleMessage: '<red>Player <yellow>%other%</yellow><red> is already visible!'
  PluginReloaded: '<green>Successfully reloaded SuperVanish (%time%ms)!'
  InvalidSender: '<red>You must be a player to execute this command!'
  PlayerNotOnline: '<red>That player is not online!'
  PlayerNonExistent: '<red>That player doesn''t exist!'
  ToggledPickingUpItemsOn: '<yellow>Picking up items is now turned <green>ON</green><yellow>.'
  ToggledPickingUpItemsOff: '<yellow>Picking up items is now turned <red>OFF</red><yellow>.'
  UpdateWarning: '<red>Warning! Recreating %updates% resets %changes%. Please use <yellow>/sv recreatefiles confirm</yellow><red> if you''d like to continue.'
  RecreatedConfig: '<green>Successfully recreated %updates%! Please check %changes%.'
  NoConfigUpdateAvailable: '<yellow>Your SuperVanish-files are up to date!'
  RecreationRequiredMsg: '<red>[SV] Your SuperVanish-files are not up to date, you can use <yellow>/sv recreatefiles</yellow><red> to recreate them
  or use /sv recreatefiles dismiss to dismiss this message.
  Recreating SuperVanish''s files gives you access to newer settings and features of the plugin.'
  DismissedRecreationWarning: '<yellow>You are no longer receiving notifications about this recreation.'
  UndismissedRecreationWarning: '<yellow>You are now receiving notifications about this recreation.'
  PrintedStacktrace: '<yellow>Successfully created a stacktrace, see console!'
  EntityHitDenied: '<red>[SV] You can''t hit players or mobs in vanish!'
  BlockPlaceDenied: '<red>[SV] You can''t place blocks in vanish!'
  BlockBreakDenied: '<red>[SV] You can''t break blocks in vanish!'
  PluginOutdated: '<red>[SV] Your current version of SuperVanish is outdated. New version: ''%new%''; Currently: ''%current%'''
  DynmapFakeJoin: '%d% joined'
  DynmapFakeQuit: '%d% quit'
  HelpHeader: "<green><---------------<yellow> SuperVanish-Help </yellow><green>--------------->"
  HelpFormat: "<gold>%usage% <gray>- <aqua>%description% <red>(%permission%)"
  PlaceholderIsVanishedYes: "Yes"
  PlaceholderIsVanishedNo: "No"
  PlaceholderVanishPrefix: '<green>[V] <reset>'
  PlaceholderVanishSuffix: ' <reset><green>[V]'
MessagesVersion: ${project.version}
